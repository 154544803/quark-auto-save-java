name: Schedule Run

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC，这里 12:00 UTC 等于北京时间 20:00
    - cron: "30 11 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare task config
        shell: bash
        run: |
          mkdir -p config
          cat <<'EOF' > config/tasks.yml
          accounts:
            - name: primary
              cookie: ${QUARK_COOKIE}

          tasks:
            - name: 仙逆
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/e00c9bcb1a3a
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/仙逆
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 1
            - name: 剑来
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/4feb19f0aee0
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/剑来
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 3
            - name: 遮天
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/074cf8985e45
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/遮天
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 2
            - name: 沧元图
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/25c00c84121e
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/沧元图
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 5
            - name: 斗罗大陆Ⅱ绝世唐门
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/fe78c334fb54
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/斗罗大陆Ⅱ绝世唐门
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 5
            - name: 斗破苍穹年番
              account: primary
              # 使用你提供的夸克分享链接
              share-url: https://pan.quark.cn/s/19fbad9d7eb1
              # 转存到你夸克网盘中的目标目录
              save-path: /动漫/斗破苍穹年番
              # 只转存视频文件
              pattern: ".*\\.(mp4|mkv)$"
              # 留空表示保持原文件名不变
              replace: ""
              enabled: true
              ignore-extension: false
              # 1-7 表示周一到周日
              run-week:
                - 6
          EOF
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}

      - name: Build project
        run: mvn -s settings.xml -B clean package -DskipTests

      - name: Run once mode
        run: java -jar target/quark-auto-save-1.0.0-SNAPSHOT-exec.jar --app.run-mode=once --app.task-file=config/tasks.yml --app.notification.mail.enabled=true
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

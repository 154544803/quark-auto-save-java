<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Auto Save Login</title>
    <link rel="stylesheet" th:href="@{/css/web-console.css}">
</head>
<body class="page page-login" data-page="login">
<main class="login-shell">
    <section class="login-card">
        <div class="login-card-body">
            <p class="eyebrow">Quark Auto Save</p>
            <h1>登录</h1>
            <p class="subtitle">用户登录后可管理账号和任务，并按需使用高级 YAML 配置入口。</p>
            <form id="login-form" class="stack">
                <label class="field">
                    <span>用户名</span>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </label>
                <label class="field">
                    <span>密码</span>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button class="primary-button" type="submit">登录</button>
            </form>
            <p id="login-error" class="message error" hidden></p>
        </div>
    </section>
</main>
<script th:src="@{/js/web-console.js}"></script>
</body>
</html>
